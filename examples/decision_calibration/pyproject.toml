[project]
name = "miles-decision-calibration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "typed-argument-parser>=1.10", "httpx>=0.27"]

[project.optional-dependencies]
model = ["torch>=2.0", "transformers>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This distribution supplies dependencies; run example modules from Miles.
py-modules = []
